version: '3.8'

services:
  zookeeper:
    image: ubuntu/zookeeper:latest
    container_name: zk
    ports:
      - "2181:2181"

  kafka:
    image: ubuntu/kafka:latest
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zk:2181
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: ["CMD", "bash", "-lc", 
             "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:14
    container_name: druid-postgres
    environment:
      - POSTGRES_USER=druid
      - POSTGRES_PASSWORD=druid
      - POSTGRES_DB=druid
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid -d druid"]
      interval: 10s
      timeout: 5s
      retries: 20

  druid-coordinator-overlord:
    image: apache/druid:27.0.0
    container_name: druid-coordinator-overlord
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    volumes:
      - ./druid/conf/druid/_common:/opt/druid/conf/druid/_common:ro
      - deep_storage:/opt/druid/var/druid/deepStorage
      - ./druid/var:/opt/druid/var
    environment:
      - DRUID_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: ["coordinator"]
    ports:
      - "8081:8081"

  druid-overlord:
    image: apache/druid:27.0.0
    container_name: druid-overlord
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    volumes:
      - ./druid/conf/druid/_common:/opt/druid/conf/druid/_common:ro
      - deep_storage:/opt/druid/var/druid/deepStorage
      - ./druid/var:/opt/druid/var
    environment:
      - DRUID_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: ["overlord"]
    ports:
      - "8090:8090"

  druid-broker:
    image: apache/druid:27.0.0
    container_name: druid-broker
    depends_on:
      druid-coordinator-overlord:
        condition: service_started
    volumes:
      - ./druid/conf/druid/_common:/opt/druid/conf/druid/_common:ro
      - deep_storage:/opt/druid/var/druid/deepStorage
      - ./druid/var:/opt/druid/var
    environment:
      - DRUID_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: ["broker"]
    ports:
      - "8082:8082"

  druid-historical:
    image: apache/druid:27.0.0
    container_name: druid-historical
    depends_on:
      druid-coordinator-overlord:
        condition: service_started
    volumes:
      - ./druid/conf/druid/_common:/opt/druid/conf/druid/_common:ro
      - deep_storage:/opt/druid/var/druid/deepStorage
      - ./druid/var:/opt/druid/var
    environment:
      - DRUID_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: ["historical"]
    ports:
      - "8083:8083"

  druid-middlemanager:
    image: apache/druid:27.0.0
    container_name: druid-middlemanager
    depends_on:
      druid-overlord:
        condition: service_started
    volumes:
      - ./druid/conf/druid/_common:/opt/druid/conf/druid/_common:ro
      - deep_storage:/opt/druid/var/druid/deepStorage
      - ./druid/var:/opt/druid/var
    environment:
      - DRUID_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: ["middleManager"]
    ports:
      - "8091:8091"

  druid-router:
    image: apache/druid:27.0.0
    container_name: druid-router
    depends_on:
      druid-broker:
        condition: service_started
    volumes:
      - ./druid/conf/druid/_common:/opt/druid/conf/druid/_common:ro
      - deep_storage:/opt/druid/var/druid/deepStorage
      - ./druid/var:/opt/druid/var
    environment:
      - DRUID_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: ["router"]
    ports:
      - "8888:8888"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_started
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zk:2181
    ports:
      - "8080:8080"

  ubuntu-tools:
    image: ubuntu:22.04
    container_name: ubuntu-tools
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./scripts:/workspace/scripts
    working_dir: /workspace
    command: bash -lc "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y kafkacat curl jq ca-certificates && echo 'Ubuntu tools ready' && tail -f /dev/null"

volumes:
  kafka_data:
  pg_data:
  deep_storage:
