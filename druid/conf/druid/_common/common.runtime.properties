# Configurações comuns do Apache Druid para ambiente docker local

# Zookeeper (usado por Druid internamente em alguns recursos). Para Druid 27 ainda é suportado.
druid.zk.service.host=zk

# Armazenamento profundo local (montado via volume)
druid.storage.type=local
druid.storage.storageDirectory=/opt/druid/var/druid/deepStorage

# Logs de tarefas de indexação
druid.indexer.logs.type=file
druid.indexer.logs.directory=/opt/druid/var/druid/indexing-logs

# Metadados no Postgres
druid.metadata.storage.type=postgresql
druid.metadata.storage.connector.connectURI=jdbc:postgresql://druid-postgres:5432/druid
druid.metadata.storage.connector.user=druid
druid.metadata.storage.connector.password=druid

# Extensões necessárias (Kafka + Postgres)
druid.extensions.loadList=["druid-kafka-indexing-service","postgresql-metadata-storage"]

# Descoberta de serviços
druid.selectors.indexing.serviceName=druid/overlord
druid.selectors.coordinator.serviceName=druid/coordinator

# HTTP
druid.server.http.numThreads=20
